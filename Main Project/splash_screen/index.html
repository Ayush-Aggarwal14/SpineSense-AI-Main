<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine Sense | App Launch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc; 
            color: #1e293b;
        }

        #app-frame {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            border: none; z-index: 1;
        }

        #splash-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            background: #ffffff;
            overflow: hidden;
        }

        /* Vibrant iOS-style Mesh Gradient Background */
        .mesh-bg {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(14, 165, 233, 0.2) 0%, transparent 40%);
            filter: blur(60px);
            animation: swirl 25s infinite linear;
            z-index: -1;
        }

        @keyframes swirl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .content-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 50px 60px;
            border-radius: 40px;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.06),
                0 0 0 1px rgba(255,255,255,0.9) inset;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* App Icon Styling (Squircle) */
        .app-icon-container {
            width: 140px; height: 140px;
            background: #ffffff;
            border-radius: 35px; /* iOS Squircle look */
            box-shadow: 0 15px 35px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.02) inset;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 24px;
            padding: 15px;
            box-sizing: border-box;
            animation: float 4s ease-in-out infinite;
        }

        .app-icon {
            width: 100%; height: auto;
        }

        .title {
            font-size: 38px; font-weight: 800; margin: 0 0 4px 0;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 16px; font-weight: 600; color: #64748b;
            margin-bottom: 35px;
        }

        /* Modern Bouncing Dots Loader */
        .dots-container {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            height: 20px;
            margin-bottom: 12px;
        }

        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background-color: #cbd5e1;
            animation: bounce 1.4s infinite ease-in-out both;
            transition: background-color 0.4s, box-shadow 0.4s;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        .dot.glow { 
            background-color: #0ea5e9; 
            box-shadow: 0 0 12px rgba(14,165,233,0.5); 
        }

        .status-text {
            font-size: 14px; font-weight: 600; color: #94a3b8;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(0);
        }

        .status-hidden {
            opacity: 0; transform: translateY(-10px);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="mesh-bg"></div>
        <div class="content-card">
            <div class="app-icon-container">
                <img src="logo.png" alt="Logo" class="app-icon">
            </div>
            <h1 class="title">Spine Sense</h1>
            <div class="subtitle">Your AI Posture Coach</div>
            
            <div class="dots-container" id="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="status-text" id="status-msg">Warming up...</div>
        </div>
    </div>

    <script>
        const splashScreen = document.getElementById('splash-screen');
        const statusMsg = document.getElementById('status-msg');
        const dots = document.querySelectorAll('.dot');
        
        const sequence = [
            { msg: "Waking up AI engine...", isDone: false, delay: 400 },
            { msg: "Syncing smart sensors...", isDone: false, delay: 1200 },
            { msg: "Almost there...", isDone: false, delay: 2000 },
            { msg: "Ready to go!", isDone: true, delay: 2600 }
        ];

        sequence.forEach(step => {
            setTimeout(() => {
                statusMsg.classList.add('status-hidden');
                
                setTimeout(() => {
                    statusMsg.innerText = step.msg;
                    statusMsg.style.transform = 'translateY(8px)';
                    void statusMsg.offsetWidth; 
                    
                    statusMsg.classList.remove('status-hidden');
                    statusMsg.style.transform = 'translateY(0)';
                    
                    if (step.isDone) {
                        dots.forEach(dot => dot.classList.add('glow'));
                    }
                }, 300);
                
            }, step.delay);
        });

        // After the animation sequence finishes, seamlessly redirect to the Streamlit app
        setTimeout(() => {
            splashScreen.style.transform = 'scale(1.05)';
            splashScreen.style.opacity = '0';
            
            setTimeout(() => {
                // Redirect the browser to the main project window
                window.location.replace("http://localhost:8501");
            }, 800); // Wait for the fade out to finish before redirecting
        }, 3200);
    </script>
</body>
</html>
